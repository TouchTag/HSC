<style>
:root{
  --bg:#0b0b10;
  --text:#f6f6fb;
  --muted:#bfc0d0;
  --stroke:#ffffff12;
  --brand:#ff6a00;
}

*{box-sizing:border-box}

body{
    margin: 0;
    min-height: 100vh;

    background-image: url("HSC-Pattern Yellow(RGB).png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
    animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:22px 14px 40px;
}

.header{text-align:center}

.logo{
  width:350px;
  margin:1px auto 2px;
  text-align:center;
}

.logo img{
  width:100%;
  height:auto;
  display:block;
  margin:auto;
}

h1{
    margin:0;
    font-size:22px;
    color:#000000;
}

.tagline{
  color:#d9d9d9;
  font-size:16px;
  margin:8px 0 12px;
  
}

.social{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0 14px;
}

.sbtn{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  color:#000;
  text-decoration:none;
}

.map{
  margin:8px 0 14px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--stroke);
}

.map iframe{
  width:100%;
  height:180px;
  border:0;
  display:block;
}

.map a{
  display:block;
  text-align:center;
  padding:10px;
  background:rgba(0,0,0,.35);
  color:#000;
  text-decoration:none;
  font-size:13px;
}


.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
 position: relative;
  display: block;
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:16px;
  text-decoration:none;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff !important;
}

.btn b{
  color:#fff !important;
}
.ic{
  position:absolute;
  left:0;
  background:transparent !important;
  border:none !important;
  width:40px;
  text-align:center;
  font-size:28px;
  color:#fff !important;
}

.left{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;

  width:100%;
}

.txt{
    flex: 1;
    text-align: center;
}

.txt b{
    font-size: 20px;
    white-space: nowrap;
}

.txt small{
  color:var(--muted);
  font-size:20px;
}

.footer{
  text-align:center;
  color:#bdbdd0;
  font-size:15px;
  margin-top:20px;
}

.footer a{
  color:#bdbdd0;
  text-decoration:none;
}
</style>
</head>
